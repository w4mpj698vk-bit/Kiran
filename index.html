<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanvith's 4th Birthday - RSVP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #0c0620;
    font-family: 'Poppins', sans-serif;
    color: #fff;
  }

  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 14px 40px;
  }

  .poster-card {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(180deg, #150a2e 0%, #1c0f38 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 60px rgba(255,62,200,0.18), 0 0 40px rgba(62,200,255,0.12);
  }

  .poster-img-wrap img { display: block; width: 100%; height: auto; }

  /* ---------- RSVP section, editable text, same card ---------- */
  .rsvp-section {
    padding: 22px 24px 24px;
    border-top: 1px dashed rgba(255,255,255,0.2);
  }
  .rsvp-section h2 {
    font-family: 'Baloo 2', cursive;
    text-align: center;
    color: #ffd93e;
    font-size: 22px;
    margin: 0 0 18px;
    text-shadow: 0 0 12px rgba(255,217,62,0.4);
  }

  [contenteditable="true"] {
    outline: none;
    border-radius: 6px;
    transition: background 0.15s;
    display: inline-block;
    cursor: text;
  }
  [contenteditable="true"]:hover, [contenteditable="true"]:focus {
    background: rgba(255,255,255,0.12);
  }
  [contenteditable="true"]:empty:before {
    content: attr(data-placeholder);
    color: rgba(255,255,255,0.35);
  }

  .field-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 15px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .field-label {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    min-width: 68px;
  }
  .field-value {
    color: #fff;
    font-weight: 600;
    border-bottom: 1px dashed rgba(255,255,255,0.35);
    padding: 2px 4px;
    min-width: 60px;
  }
  .field-value.name-value { color: #ff3ec8; font-family: 'Baloo 2', cursive; font-size: 18px; }
  .field-value.guests-value { color: #3ec8ff; font-family: 'Baloo 2', cursive; font-size: 18px; min-width: 30px; text-align: center; }

  .coming-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .coming-toggle {
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-family: 'Baloo 2', cursive;
    font-size: 17px;
    padding: 4px 14px;
    border-bottom: 2px solid rgba(255,255,255,0.25);
    cursor: pointer;
    transition: all 0.15s;
  }
  .coming-toggle.yes.active { color: #b6ff2e; border-color: #b6ff2e; text-shadow: 0 0 10px rgba(182,255,46,0.5); }
  .coming-toggle.no.active { color: #ff3ec8; border-color: #ff3ec8; text-shadow: 0 0 10px rgba(255,62,200,0.5); }

  #guests-row { display: none; }
  #guests-row.show { display: flex; }

  .submit-btn {
    margin-top: 6px; width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #ff3ec8, #a238ff 60%, #3ec8ff);
    color: #fff; font-family: 'Baloo 2', cursive; font-size: 17px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; box-shadow: 0 0 22px rgba(255,62,200,0.35);
  }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { text-align: center; margin-top: 10px; font-size: 13px; min-height: 16px; }
  .msg.ok { color: #b6ff2e; }
  .msg.err { color: #ff3ec8; }
  .confirmed-card { text-align: center; padding: 10px 0 6px; }
  .confirmed-card .big { font-family: 'Baloo 2', cursive; font-size: 22px; color: #b6ff2e; text-shadow: 0 0 14px rgba(182,255,46,0.5); }
  .confirmed-card p { color: rgba(255,255,255,0.7); font-size: 13.5px; }

  .guest-list { padding: 16px 20px 22px; border-top: 1px dashed rgba(255,255,255,0.2); }
  .guest-list h3 { font-family: 'Baloo 2', cursive; text-align: center; color: #3ec8ff; font-size: 18px; text-shadow: 0 0 10px rgba(62,200,255,0.4); margin: 0 0 4px; }
  .guest-list .count { text-align: center; color: rgba(255,255,255,0.6); font-size: 12.5px; margin-bottom: 14px; }
  .guest-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); margin-bottom: 7px; font-size: 13.5px; }
  .guest-item .name { font-weight: 600; }
  .guest-item .qty { color: #ffd93e; font-size: 12px; }
  .guest-item.no .name { color: rgba(255,255,255,0.4); text-decoration: line-through; }
  .badge-yes { color: #b6ff2e; font-size: 10.5px; border: 1px solid #b6ff2e; padding: 2px 7px; border-radius: 20px; }
  .badge-no { color: #ff3ec8; font-size: 10.5px; border: 1px solid #ff3ec8; padding: 2px 7px; border-radius: 20px; }
  .empty { text-align: center; color: rgba(255,255,255,0.4); font-size: 12.5px; padding: 8px; }
</style>
</head>

    <div class="rsvp-section" id="form-card">
      <h2>Let's Get This Party Started 🎉</h2>

      <div class="field-row">
        <span class="field-label">Name:</span>
        <span class="field-value name-value" id="name" contenteditable="true" data-placeholder="tap to type your name"></span>
      </div>

      <div class="coming-row">
        <span class="field-label">Coming?</span>
        <span class="coming-toggle yes" id="toggle-yes" onclick="setAttending(true)">Yes</span>
        <span class="coming-toggle no" id="toggle-no" onclick="setAttending(false)">No</span>
      </div>

      <div class="field-row" id="guests-row">
        <span class="field-label">Guests:</span>
        <span class="field-value guests-value" id="guests" contenteditable="true">1</span>
      </div>

      <button class="submit-btn" id="submit-btn" onclick="submitRSVP()">Send RSVP</button>
      <div class="msg" id="form-msg"></div>
    </div>

    

  </div>

<script>
let attending = null;

function setAttending(val) {
  attending = val;
  document.getElementById('toggle-yes').classList.toggle('active', val === true);
  document.getElementById('toggle-no').classList.toggle('active', val === false);
  document.getElementById('guests-row').classList.toggle('show', val === true);
}

async function loadGuestList() {
  const itemsEl = document.getElementById('guest-items');
  const summaryEl = document.getElementById('guest-count-summary');
  try {
    const listResult = await window.storage.list('rsvp:', true);
    const keys = listResult ? listResult.keys : [];
    if (!keys || keys.length === 0) {
      itemsEl.innerHTML = '<div class="empty">No RSVPs yet — be the first!</div>';
      summaryEl.textContent = '';
      return;
    }
    const entries = [];
    for (const key of keys) {
      try {
        const res = await window.storage.get(key, true);
        if (res && res.value) entries.push(JSON.parse(res.value));
      } catch (e) { /* skip */ }
    }
    entries.sort((a, b) => (b.ts || 0) - (a.ts || 0));

    let totalPeople = 0, yesCount = 0;
    itemsEl.innerHTML = entries.map(e => {
      if (e.attending) {
        totalPeople += (e.count || 1);
        yesCount++;
        return `<div class="guest-item">
          <div>
            <div class="name">${escapeHtml(e.name)}</div>
            <div class="qty">${e.count || 1} ${((e.count||1) === 1) ? 'person' : 'people'}</div>
          </div>
          <span class="badge-yes">Attending</span>
        </div>`;
      } else {
        return `<div class="guest-item no">
          <div class="name">${escapeHtml(e.name)}</div>
          <span class="badge-no">Can't make it</span>
        </div>`;
      }
    }).join('');

    summaryEl.textContent = `${yesCount} ${yesCount === 1 ? 'RSVP' : 'RSVPs'} attending · ${totalPeople} people total`;
  } catch (e) {
    itemsEl.innerHTML = '<div class="empty">Couldn\'t load the guest list right now.</div>';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function submitRSVP() {
  const msgEl = document.getElementById('form-msg');
  const name = document.getElementById('name').textContent.trim();

  msgEl.className = 'msg';
  msgEl.textContent = '';

  if (!name) {
    msgEl.className = 'msg err';
    msgEl.textContent = 'Please enter your name.';
    return;
  }
  if (attending === null) {
    msgEl.className = 'msg err';
    msgEl.textContent = 'Please let us know if you can make it.';
    return;
  }

  let count = 1;
  if (attending) {
    const raw = document.getElementById('guests').textContent.trim();
    count = parseInt(raw, 10);
    if (isNaN(count) || count < 1) count = 1;
  } else {
    count = 0;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  const entry = { name, attending, count, ts: Date.now() };
  const key = 'rsvp:' + name.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_' + Date.now();

  try {
    const result = await window.storage.set(key, JSON.stringify(entry), true);
    if (!result) throw new Error('save failed');

    document.getElementById('form-card').innerHTML = `
      <div class="confirmed-card">
        <div class="big">${attending ? "You're on the list! 🤩" : "Thanks for letting us know 💛"}</div>
        <p>${attending ? "Can't wait to jump with you, " + escapeHtml(name) + "!" : "We'll miss you, " + escapeHtml(name) + "!"}</p>
      </div>
    `;
    await loadGuestList();
  } catch (e) {
    msgEl.className = 'msg err';
    msgEl.textContent = "Something went wrong saving your RSVP — please try again.";
    btn.disabled = false;
    btn.textContent = 'Send RSVP';
  }
}

loadGuestList();
</script>
<script>
  // Elements
  const toggleYes = document.querySelector('.coming-toggle.yes');
  const toggleNo = document.querySelector('.coming-toggle.no');
  const guestsRow = document.getElementById('guests-row');
  const btnSubmit = document.querySelector('.submit-btn');
  const msgDiv = document.querySelector('.msg');
  const rsvpFormSection = document.querySelector('.rsvp-section');

  let isAttending = true;

  // Toggle Handling
  toggleYes.addEventListener('click', () => {
    toggleYes.classList.add('active');
    toggleNo.classList.remove('active');
    guestsRow.classList.add('show');
    isAttending = true;
  });

  toggleNo.addEventListener('click', () => {
    toggleNo.classList.add('active');
    toggleYes.classList.remove('active');
    guestsRow.classList.remove('show');
    isAttending = false;
  });

  // Submit Handling
  btnSubmit.addEventListener('click', async () => {
    const name = document.querySelector('.name-value').innerText.trim();
    const guests = document.querySelector('.guests-value').innerText.trim();

    // Validation
    if (!name || name === "") {
      msgDiv.className = "msg err";
      msgDiv.innerText = "Please enter your name!";
      return;
    }

    if (isAttending && (!guests || isNaN(guests) || parseInt(guests) < 1)) {
      msgDiv.className = "msg err";
      msgDiv.innerText = "Please enter a valid number of guests!";
      return;
    }

    // Disable button during network request
    btnSubmit.disabled = true;
    msgDiv.className = "msg";
    msgDiv.innerText = "Sending your RSVP...";

    // Prepare URL-encoded form data parameters
    const webAppUrl = "https://script.google.com/macros/s/AKfycbwt2kvOl5nzmgqj2F14AamxP5dYAqv090RM9wXat-N9uIFwxjwDZSkwQL4qxq8VOPH3/exec"; // <-- Paste your Web App URL here
    const formData = new URLSearchParams();
    formData.append('name', name);
    formData.append('attending', isAttending ? 'Yes' : 'No');
    formData.append('guests', isAttending ? guests : '0');

    try {
      const response = await fetch(webAppUrl, {
        method: 'POST',
        body: formData,
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        }
      });

      const resData = await response.json();

    if (resData.result === 'success') {
        // Dynamic messaging based on response selection
        let finalMessage = "";
        
        if (isAttending) {
          finalMessage = `
            <div class="big">Let's rock the party!</div>
            <p>Can't wait to see you there, <strong>${name}</strong>.</p>
          `;
        } else {
          finalMessage = `
            <div class="big">Sorry for missing you, <strong>${name}</strong>.</div>
            <p>We'll miss you at the party!</p>
          `;
        }

        // Replace the form layout area with the customized response
        rsvpFormSection.innerHTML = `
          <div class="confirmed-card">
            ${finalMessage}
          </div>
        `;
      }  else {
        throw new Error(resData.error || "Submission failed saved error from server logic.");
      }

    } catch (err) {
      console.error(err);
      btnSubmit.disabled = false;
      msgDiv.className = "msg err";
      msgDiv.innerText = "Something went wrong. Please try again.";
    }
  });
</script>
</body>
</html>
